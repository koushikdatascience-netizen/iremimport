upstream bridge_api {
    least_conn;
    server api1:8091 max_fails=3 fail_timeout=10s;
    server api2:8091 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 8091;
    server_name _;

    client_max_body_size 25M;

    location / {
        proxy_pass http://bridge_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;

        # Nginx does not retry non-idempotent requests unless explicitly told
        # to do so, which is important for purchase-save.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location = /gateway-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
