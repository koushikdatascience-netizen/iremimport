services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - madhushala_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api-gateway:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - madhushala_loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    security_opt:
      - no-new-privileges:true

  alloy:
    image: grafana/alloy:v1.9.1
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - madhushala_alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-now}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - madhushala_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      - prometheus
      - loki
    security_opt:
      - no-new-privileges:true

volumes:
  madhushala_prometheus_data:
  madhushala_grafana_data:
  madhushala_loki_data:
  madhushala_alloy_data:
