<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madhushala Excise Import Bridge</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="container">
        <header>
            <h1>Madhushala Excise Import Bridge</h1>
            <p>Production Foundation for Excise Integration</p>
        </header>
        
        <section id="controls">
            <button id="start-automation" class="btn btn-primary">Start Automation</button>
            <button id="open-excise" class="btn btn-secondary">Open Excise Portal</button>
            <button id="stop-automation" class="btn btn-danger">Stop Automation</button>
        </section>
        
        <section id="status">
            <h2>System Status</h2>
            <div id="browser-status">Browser: Not Running</div>
            <div id="selected-items">Selected Items: None</div>
        </section>
        
        <section id="mapping-required">
            <h2>Mapping Required</h2>
            <p>No items require mapping yet.</p>
        </section>
    </div>
    
    <script src="/static/app.js"></script>
</body>
</html>
