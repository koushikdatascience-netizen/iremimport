name: madhushala-automation-platform

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: madhushala_automation_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOCAL_HOST: 0.0.0.0
      LOCAL_PORT: 8091
      DISPLAY: :99
      HEADLESS: "false"
      BROWSER_PROFILE_DIR: /app/data/browser_profile
      CAPTURES_DIR: /app/data/captures
      MAPPINGS_DIR: /app/data/mappings
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8091:8091"
      - "127.0.0.1:6080:6080"
    volumes:
      - madhushala_automation_data:/app/data
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  madhushala_automation_data:
    external: true
    name: madhushala-automation-platform_madhushala_automation_data
