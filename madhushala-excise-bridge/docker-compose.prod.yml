name: madhushala-automation-platform

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    container_name: madhushala_postgres
    profiles: ["local-postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: madhushala_bridge
      POSTGRES_USER: madhushala_bridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - madhushala_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madhushala_bridge -d madhushala_bridge"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: madhushala-automation-platform-web:latest
    container_name: madhushala_automation_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOCAL_HOST: 0.0.0.0
      LOCAL_PORT: 8091
      DISPLAY: :99
      HEADLESS: "false"
      BROWSER_PROFILE_DIR: /app/data/browser_profile
      CAPTURES_DIR: /app/data/captures
      MAPPINGS_DIR: /app/data/mappings
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - madhushala_automation_data:/app/data
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api1:
    image: madhushala-automation-platform-web:latest
    restart: unless-stopped
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8091"
      - --proxy-headers
      - --forwarded-allow-ips=*
    env_file:
      - .env
    environment:
      LOCAL_HOST: 0.0.0.0
      LOCAL_PORT: 8091
      HEADLESS: "true"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - madhushala_automation_data:/app/data
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  api2:
    image: madhushala-automation-platform-web:latest
    restart: unless-stopped
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8091"
      - --proxy-headers
      - --forwarded-allow-ips=*
    env_file:
      - .env
    environment:
      LOCAL_HOST: 0.0.0.0
      LOCAL_PORT: 8091
      HEADLESS: "true"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - madhushala_automation_data:/app/data
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./deploy/nginx/api-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8091/gateway-health >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  madhushala_automation_data:
    external: true
    name: madhushala-automation-platform_madhushala_automation_data
  madhushala_postgres_data:
    name: madhushala-automation-platform_postgres_data
