name: madhushala-automation-platform

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-madhushala_bridge}
      POSTGRES_USER: ${POSTGRES_USER:-madhushala_bridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required when the postgres profile is enabled}
    volumes:
      - madhushala_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-madhushala_bridge} -d ${POSTGRES_DB:-madhushala_bridge}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: madhushala_automation_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOCAL_HOST: 0.0.0.0
      LOCAL_PORT: 8091
      DISPLAY: :99
      HEADLESS: "false"
      BROWSER_PROFILE_DIR: /app/data/browser_profile
      CAPTURES_DIR: /app/data/captures
      MAPPINGS_DIR: /app/data/mappings
    ports:
      - "127.0.0.1:8091:8091"
      - "127.0.0.1:6080:6080"
    volumes:
      - madhushala_automation_data:/app/data
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  madhushala_automation_data:
    external: true
    name: madhushala-automation-platform_madhushala_automation_data
  madhushala_postgres_data:
    name: madhushala-automation-platform_postgres_data
