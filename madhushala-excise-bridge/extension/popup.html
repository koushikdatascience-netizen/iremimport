<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excise Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <span>Madhushala</span>
      <h1>Excise Capture</h1>
    </header>

    <section class="panel">
      <label for="server-url">Bridge URL</label>
      <input id="server-url" type="url" value="http://13.232.52.191/excise-import" spellcheck="false">
      <label for="excise-user">Excise User ID</label>
      <input id="excise-user" type="text" autocomplete="username" spellcheck="false">
      <label for="excise-password">Excise Password</label>
      <input id="excise-password" type="password" autocomplete="current-password">
      <button id="save-settings" type="button" class="secondary">Save Setup</button>
    </section>

    <section class="panel">
      <div id="status" class="status">Open portal, enter CAPTCHA, then prepare indent.</div>
      <button id="open-portal" type="button">Open Portal</button>
      <button id="capture" type="button">Capture Selected</button>
      <button id="open-mapping" type="button" class="secondary">Open Mapping</button>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
