<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excise Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <span>Madhushala</span>
      <h1>Excise Bridge</h1>
    </header>

    <section class="panel">
      <div id="status" class="status">Loading...</div>
      <label for="excise-login-url">WB Excise Login URL</label>
      <input id="excise-login-url" type="url" autocomplete="url">
      <label for="excise-user">WB Excise User ID</label>
      <input id="excise-user" autocomplete="username">
      <label for="excise-password">WB Excise Password</label>
      <input id="excise-password" type="password" autocomplete="current-password">
      <button id="save-settings" type="button">Save Portal Details</button>
      <p>Open Madhushala import from CRM, then use Open Excise Portal there.</p>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
