name: QR photograph decoder regression
on:
  pull_request:
    paths:
      - 'madhushala-excise-bridge/app/static/app.js'
      - 'madhushala-excise-bridge/app/modules/document_import/qr_decoder.py'
      - 'madhushala-excise-bridge/tests/test_qr_photo_fallback.py'
      - '.github/workflows/test-qr-photo-fallback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: madhushala-excise-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_qr_photo_fallback.py tests/test_qr_browser_fallback.py
      - name: Validate JavaScript
        run: node --check app/static/app.js
