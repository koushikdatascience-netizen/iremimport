name: AP category summary regression
on:
  pull_request:
    paths:
      - 'madhushala-excise-bridge/app/modules/document_import/ap_icdc/category_summary.py'
      - 'madhushala-excise-bridge/app/modules/document_import/service.py'
      - 'madhushala-excise-bridge/tests/test_ap_category_summary.py'
      - '.github/workflows/test-ap-category-summary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: madhushala-excise-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_ap_category_summary.py tests/test_document_import.py tests/test_purchase_handoff.py
