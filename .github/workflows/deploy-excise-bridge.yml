name: Deploy Excise Bridge

on:
  push:
    branches:
      - master
    paths:
      - "madhushala-excise-bridge/**"
      - ".github/workflows/deploy-excise-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: madhushala-excise-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: madhushala-excise-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: madhushala-excise-bridge/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall -q app

      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-placeholder-password
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml config >/dev/null
          rm -f .env

      - name: Run tests
        run: pytest -q

  deploy:
    name: Deploy production
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via existing server SSH
        env:
          SERVER_HOST: integrations.madhushalasoftware.com
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY_B64 }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "${SERVER_USER:-}" ] || [ -z "${SERVER_SSH_KEY_B64:-}" ]; then
            echo "SERVER_USER and SERVER_SSH_KEY_B64 secrets are required."
            exit 1
          fi

          SSH_PORT="${SERVER_PORT:-22}"
          TARGET_COMMIT="${GITHUB_SHA}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SERVER_SSH_KEY_B64" | base64 --decode > ~/.ssh/madhushala_deploy_key
          chmod 600 ~/.ssh/madhushala_deploy_key
          ssh-keygen -y -f ~/.ssh/madhushala_deploy_key >/dev/null

          echo "Testing SSH connection to $SERVER_USER@$SERVER_HOST:$SSH_PORT..."
          ssh \
            -i ~/.ssh/madhushala_deploy_key \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" \
            'echo "SSH OK: $(hostname)"'

          ssh \
            -i ~/.ssh/madhushala_deploy_key \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$SERVER_USER@$SERVER_HOST" \
            "TARGET_COMMIT=$TARGET_COMMIT GITHUB_TOKEN=$GITHUB_TOKEN bash -s" <<'REMOTE'
          set -euo pipefail

          REPO=/srv/projects/iremimport
          SERVICE_DIR=madhushala-excise-bridge
          RELEASES="$HOME/madhushala-releases"
          DEPLOY_STATE="$HOME/.madhushala-deploy"
          CONFIG_ENV="$DEPLOY_STATE/.env"
          BACKUPS=/srv/backups/madhushala
          LIVE_VOLUME=madhushala-automation-platform_madhushala_automation_data
          LIVE_CONTAINER=madhushala_automation_web

          echo "== Preflight =="
          test -d "$REPO/.git"
          docker volume inspect "$LIVE_VOLUME" >/dev/null
          test -d "$BACKUPS"
          mkdir -p "$RELEASES" "$DEPLOY_STATE"

          echo "== Fetch exact GitHub commit =="
          if git -C "$REPO" remote get-url origin | grep -q '^https://github.com/'; then
            AUTH_HEADER=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)
            git -C "$REPO" -c "http.https://github.com/.extraheader=AUTHORIZATION: Basic $AUTH_HEADER" fetch origin master
          else
            git -C "$REPO" fetch origin master
          fi
          git -C "$REPO" cat-file -e "$TARGET_COMMIT^{commit}"

          DEPLOY_SHA="$TARGET_COMMIT"
          SHORT_SHA="$(printf '%s' "$DEPLOY_SHA" | cut -c1-8)"
          STAMP="$(date +%Y%m%d-%H%M%S)"
          RELEASE_ROOT="$RELEASES/madhushala-$STAMP-$SHORT_SHA"
          APP_DIR="$RELEASE_ROOT/$SERVICE_DIR"

          echo "Deploying $DEPLOY_SHA"

          echo "== Back up persistent data =="
          docker run --rm \
            -v "$LIVE_VOLUME:/data:ro" \
            -v "$BACKUPS:/backup" \
            alpine sh -c "tar czf /backup/madhushala-data-$STAMP-$SHORT_SHA.tar.gz -C /data ."

          if docker inspect madhushala_postgres >/dev/null 2>&1; then
            echo "== Back up PostgreSQL =="
            docker exec madhushala_postgres \
              pg_dump -U madhushala_bridge -d madhushala_bridge \
              | gzip \
              | sudo -n tee "$BACKUPS/madhushala-postgres-$STAMP-$SHORT_SHA.sql.gz" >/dev/null
          fi

          echo "== Create immutable release =="
          mkdir -p "$RELEASE_ROOT"
          git -C "$REPO" archive "$DEPLOY_SHA" "$SERVICE_DIR" | tar -x -C "$RELEASE_ROOT"

          echo "== Restore server-only environment =="
          if [ -f "$CONFIG_ENV" ]; then
            cp "$CONFIG_ENV" "$APP_DIR/.env"
          else
            CURRENT_DIR=""
            if docker inspect "$LIVE_CONTAINER" >/dev/null 2>&1; then
              CURRENT_DIR="$(docker inspect "$LIVE_CONTAINER" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' 2>/dev/null || true)"
            fi
            if [ -n "$CURRENT_DIR" ] && [ -f "$CURRENT_DIR/.env" ]; then
              cp "$CURRENT_DIR/.env" "$APP_DIR/.env"
              cp "$CURRENT_DIR/.env" "$CONFIG_ENV"
            else
              echo "ERROR: production .env not found"
              exit 1
            fi
          fi
          chmod 600 "$APP_DIR/.env" "$CONFIG_ENV" || true

          set_env_value() {
            key="$1"
            value="$2"
            file="$3"
            tmp="$(mktemp)"
            awk -F= -v key="$key" '$1 != key { print }' "$file" > "$tmp"
            printf '%s=%s\n' "$key" "$value" >> "$tmp"
            mv "$tmp" "$file"
            chmod 600 "$file"
          }

          CURRENT_DATABASE_URL="$(grep -E '^DATABASE_URL=' "$CONFIG_ENV" | tail -n 1 | cut -d= -f2- || true)"
          MIGRATE_SQLITE=0
          LOCAL_POSTGRES=0

          if printf '%s' "$CURRENT_DATABASE_URL" | grep -Eq '^postgres(ql)?://'; then
            DATABASE_URL="$CURRENT_DATABASE_URL"
            if printf '%s' "$DATABASE_URL" | grep -q '@postgres:5432/'; then
              LOCAL_POSTGRES=1
              POSTGRES_PASSWORD="$(grep -E '^POSTGRES_PASSWORD=' "$CONFIG_ENV" | tail -n 1 | cut -d= -f2- || true)"
              if [ -z "$POSTGRES_PASSWORD" ]; then
                echo "ERROR: local PostgreSQL URL exists but POSTGRES_PASSWORD is missing"
                exit 1
              fi
            fi
            echo "Database backend: PostgreSQL"
          else
            echo "Database backend: SQLite; one-time migration to local PostgreSQL required"
            MIGRATE_SQLITE=1
            LOCAL_POSTGRES=1
            POSTGRES_PASSWORD="$(grep -E '^POSTGRES_PASSWORD=' "$CONFIG_ENV" | tail -n 1 | cut -d= -f2- || true)"
            if [ -z "$POSTGRES_PASSWORD" ]; then
              POSTGRES_PASSWORD="$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            fi
            DATABASE_URL="postgresql://madhushala_bridge:$POSTGRES_PASSWORD@postgres:5432/madhushala_bridge"
          fi

          if [ "$LOCAL_POSTGRES" -eq 1 ]; then
            export POSTGRES_PASSWORD
          fi

          echo "== Validate Compose uses the live production identity =="
          cd "$APP_DIR"
          dc() {
            docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml "$@"
          }
          dc config >/tmp/madhushala-compose-$SHORT_SHA.yml
          grep -q 'madhushala-automation-platform_madhushala_automation_data' /tmp/madhushala-compose-$SHORT_SHA.yml
          grep -q 'container_name: madhushala_automation_web' /tmp/madhushala-compose-$SHORT_SHA.yml

          echo "== Build image =="
          dc build web

          echo "== Start shared Redis cache =="
          dc up -d redis

          echo "== Wait for Redis =="
          REDIS_READY=0
          for attempt in $(seq 1 30); do
            # Never let docker compose exec inherit the SSH heredoc stdin; it can
            # consume the remaining deployment script and make SSH exit 0 early.
            if dc exec -T redis redis-cli ping </dev/null 2>/dev/null | grep -q PONG; then
              REDIS_READY=1
              break
            fi
            sleep 1
          done
          if [ "$REDIS_READY" -ne 1 ]; then
            echo "ERROR: Redis did not become ready"
            dc logs --tail=100 redis
            exit 1
          fi

          if [ "$LOCAL_POSTGRES" -eq 1 ]; then
            echo "== Start PostgreSQL =="
            dc --profile local-postgres up -d postgres

            POSTGRES_READY=0
            for attempt in $(seq 1 30); do
              if dc --profile local-postgres exec -T postgres \
                pg_isready -U madhushala_bridge -d madhushala_bridge </dev/null >/dev/null 2>&1; then
                POSTGRES_READY=1
                break
              fi
              sleep 2
            done
            if [ "$POSTGRES_READY" -ne 1 ]; then
              echo "ERROR: PostgreSQL did not become ready"
              dc --profile local-postgres logs --tail=150 postgres
              exit 1
            fi
          fi

          if [ "$MIGRATE_SQLITE" -eq 1 ]; then
            echo "== Quiesce old API for consistent SQLite migration =="
            OLD_WEB_STOPPED=0
            if docker inspect "$LIVE_CONTAINER" >/dev/null 2>&1; then
              docker stop "$LIVE_CONTAINER" >/dev/null
              OLD_WEB_STOPPED=1
            fi
            migration_failed() {
              if [ "$OLD_WEB_STOPPED" -eq 1 ]; then
                echo "Migration failed; restarting previous production container"
                docker start "$LIVE_CONTAINER" >/dev/null 2>&1 || true
              fi
            }
            trap migration_failed ERR

            echo "== Migrate SQLite to PostgreSQL =="
            docker run --rm \
              --network madhushala-automation-platform_default \
              -e DATABASE_URL="$DATABASE_URL" \
              -e SQLITE_PATH=/app/data/bridge.db \
              -v "$LIVE_VOLUME:/app/data:ro" \
              madhushala-automation-platform-web:latest \
              python -m app.migrate_sqlite_to_postgres

            set_env_value "POSTGRES_PASSWORD" "$POSTGRES_PASSWORD" "$CONFIG_ENV"
            set_env_value "DATABASE_URL" "$DATABASE_URL" "$CONFIG_ENV"
            set_env_value "DB_POOL_MIN_SIZE" "1" "$CONFIG_ENV"
            set_env_value "DB_POOL_MAX_SIZE" "10" "$CONFIG_ENV"
            cp "$CONFIG_ENV" "$APP_DIR/.env"
            chmod 600 "$APP_DIR/.env"
            trap - ERR
          else
            cp "$CONFIG_ENV" "$APP_DIR/.env"
          fi

          echo "== Deploy singleton browser plus two API replicas =="
          # Legacy deployments published 8091 directly from madhushala_automation_web.
          # Remove that singleton explicitly before recreating the current topology,
          # otherwise the stale container can keep ownership of host port 8091 and
          # bypass api-gateway even though the new API replicas are healthy.
          if docker inspect madhushala_automation_web >/dev/null 2>&1; then
            docker rm -f madhushala_automation_web >/dev/null
          fi
          dc rm -sf api1 api2 api-gateway >/dev/null 2>&1 || true
          dc up -d --force-recreate web api1 api2 api-gateway

          echo "== Verify host port ownership =="
          WEB_CID="$(dc ps -q web)"
          GATEWAY_CID="$(dc ps -q api-gateway)"
          if [ -z "$WEB_CID" ] || [ -z "$GATEWAY_CID" ]; then
            echo "ERROR: web or api-gateway container is missing after recreation"
            dc ps -a
            exit 1
          fi

          WEB_BINDINGS="$(docker inspect "$WEB_CID" --format '{{json .HostConfig.PortBindings}}')"
          GATEWAY_BINDINGS="$(docker inspect "$GATEWAY_CID" --format '{{json .HostConfig.PortBindings}}')"
          echo "web bindings: $WEB_BINDINGS"
          echo "api-gateway bindings: $GATEWAY_BINDINGS"

          if printf '%s' "$WEB_BINDINGS" | grep -q '"8091/tcp"'; then
            echo "ERROR: legacy web container still publishes host port 8091"
            exit 1
          fi
          if ! printf '%s' "$GATEWAY_BINDINGS" | grep -q '"8091/tcp"'; then
            echo "ERROR: api-gateway does not own host port 8091"
            exit 1
          fi

          OWNER_8091="$(docker ps --format '{{.Names}} {{.Ports}}' | grep '127.0.0.1:8091->8091/tcp' || true)"
          echo "host 8091 owner: $OWNER_8091"
          if ! printf '%s' "$OWNER_8091" | grep -q 'api-gateway'; then
            echo "ERROR: host port 8091 is not owned by api-gateway"
            docker ps --format '{{.ID}} {{.Image}} {{.Names}} {{.Ports}}'
            exit 1
          fi

          echo "== Verify every API replica serves this release =="
          for svc in api1 api2; do
            cid="$(dc ps -q "$svc")"
            if [ -z "$cid" ]; then
              echo "ERROR: $svc container is missing"
              exit 1
            fi
            echo "$svc container=$cid image=$(docker inspect "$cid" --format '{{.Image}}')"
            REPLICA_HTML="$(dc exec -T "$svc" curl -fsS "http://127.0.0.1:8091/document-import?replica=$svc-$SHORT_SHA" </dev/null)"
            echo "$svc scripts:"
            printf '%s' "$REPLICA_HTML" | grep -oE '<script[^>]+src="[^"]+"' || true
            if ! printf '%s' "$REPLICA_HTML" | grep -q 'mapping-row-identity.js?v=20260920-direct-flow-v4' \
              || ! printf '%s' "$REPLICA_HTML" | grep -q 'continueExtractedDocumentToMapping'; then
              echo "ERROR: $svc is serving an old/incorrect frontend"
              exit 1
            fi
          done

          echo "== Health check =="
          HEALTHY=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8091/health/ready >/tmp/madhushala-health.json 2>/dev/null; then
              HEALTHY=1
              break
            fi
            sleep 3
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "ERROR: health check failed"
            dc ps
            dc logs --tail=200 api-gateway api1 api2 web
            exit 1
          fi

          cat /tmp/madhushala-health.json
          echo

          echo "== Point the enabled public Excise location at the release gateway =="
          if ! sudo -n true 2>/dev/null; then
            echo "ERROR: passwordless sudo is required to validate the enabled Nginx route"
            exit 1
          fi
          NGINX_CONFIGS=""
          for candidate in /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*; do
            [ -f "$candidate" ] || continue
            if sudo -n grep -q 'server_name.*integrations\.madhushalasoftware\.com' "$candidate" \
              && sudo -n grep -q 'location.*\/excise-import\/' "$candidate"; then
              NGINX_CONFIGS="$NGINX_CONFIGS $(readlink -f "$candidate")"
            fi
          done
          NGINX_CONFIGS="$(printf '%s\n' $NGINX_CONFIGS | sed '/^$/d' | sort -u)"
          NGINX_CONFIG_COUNT="$(printf '%s\n' "$NGINX_CONFIGS" | sed '/^$/d' | wc -l)"
          if [ "$NGINX_CONFIG_COUNT" -ne 1 ]; then
            echo "ERROR: expected one enabled integrations.madhushalasoftware.com Excise config, found $NGINX_CONFIG_COUNT"
            printf '%s\n' "$NGINX_CONFIGS"
            exit 1
          fi
          NGINX_CONFIG="$NGINX_CONFIGS"
          sudo -n cp "$NGINX_CONFIG" "$NGINX_CONFIG.before-$SHORT_SHA"
          sudo -n sed -i \
            '/location.*\/excise-import\//,/^[[:space:]]*}/ s#proxy_pass[[:space:]].*;#proxy_pass http://127.0.0.1:8091/;#' \
            "$NGINX_CONFIG"
          sudo -n nginx -t
          sudo -n systemctl reload nginx

          echo "== Verify freshly deployed frontend at the API gateway =="
          LOCAL_GATEWAY_HTML="$(curl -fsS -H 'Cache-Control: no-cache, no-store' \
            "http://127.0.0.1:8091/document-import?deploy=$SHORT_SHA")"
          if ! printf '%s' "$LOCAL_GATEWAY_HTML" \
            | grep -q 'mapping-row-identity.js?v=20260920-direct-flow-v4' \
            || ! printf '%s' "$LOCAL_GATEWAY_HTML" | grep -q 'continueExtractedDocumentToMapping'; then
            echo "ERROR: 127.0.0.1:8091 is not serving deployment $DEPLOY_SHA"
            printf '%s' "$LOCAL_GATEWAY_HTML" | grep -oE '<script[^>]+src="[^"]+"' || true
            exit 1
          fi

          echo "== Verify local Nginx/SNI route reaches the same release =="
          LOCAL_NGINX_HTML="$(curl -kfsSL \
            --resolve integrations.madhushalasoftware.com:443:127.0.0.1 \
            -H 'Cache-Control: no-cache, no-store' \
            "https://integrations.madhushalasoftware.com/excise-import/document-import?deploy=$SHORT_SHA")"
          if ! printf '%s' "$LOCAL_NGINX_HTML" \
            | grep -q 'mapping-row-identity.js?v=20260920-direct-flow-v4' \
            || ! printf '%s' "$LOCAL_NGINX_HTML" | grep -q 'continueExtractedDocumentToMapping'; then
            echo "ERROR: local Nginx route for integrations.madhushalasoftware.com is not serving the release gateway"
            echo "Selected enabled config: $NGINX_CONFIG"
            sudo -n sed -n '/server_name.*integrations\.madhushalasoftware\.com/,+140p' "$NGINX_CONFIG" || true
            echo "Gateway scripts:"
            printf '%s' "$LOCAL_GATEWAY_HTML" | grep -oE '<script[^>]+src="[^"]+"' || true
            echo "Local Nginx scripts:"
            printf '%s' "$LOCAL_NGINX_HTML" | grep -oE '<script[^>]+src="[^"]+"' || true
            exit 1
          fi

          echo "== Origin identity and public-interface diagnostics =="
          echo "Hostname: $(hostname)"
          echo "IPv4 addresses:"
          ip -4 addr show || true
          echo "443 listeners:"
          sudo -n ss -ltnp 2>/dev/null | grep -E '(:443[[:space:]]|:443$)' || true

          IMDS_TOKEN="$(curl -fsS -m 2 -X PUT \
            -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' \
            http://169.254.169.254/latest/api/token 2>/dev/null || true)"
          if [ -n "$IMDS_TOKEN" ]; then
            EC2_PUBLIC_IPV4="$(curl -fsS -m 2 \
              -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
              http://169.254.169.254/latest/meta-data/public-ipv4 2>/dev/null || true)"
            EC2_INSTANCE_ID="$(curl -fsS -m 2 \
              -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
              http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null || true)"
            echo "EC2 instance id: $EC2_INSTANCE_ID"
            echo "EC2 public IPv4: $EC2_PUBLIC_IPV4"
          else
            echo "EC2 metadata unavailable."
          fi

          echo "Enabled integrations.madhushalasoftware.com server blocks:"
          sudo -n nginx -T 2>/dev/null \
            | awk '
                /server[[:space:]]*\{/ {block=$0; capture=1; found=0; next}
                capture {block=block ORS $0}
                /server_name[[:space:]].*integrations\.madhushalasoftware\.com/ {found=1}
                capture && /^}/ {
                  if (found) print block ORS "---"
                  capture=0; block=""; found=0
                }
              ' || true

          echo "== Start Prometheus and Grafana =="
          dc up -d prometheus grafana

          echo "== Verify Prometheus =="
          PROM_READY=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9090/-/ready >/dev/null 2>&1; then
              PROM_READY=1
              break
            fi
            sleep 2
          done
          if [ "$PROM_READY" -ne 1 ]; then
            echo "ERROR: Prometheus did not become ready"
            dc logs --tail=150 prometheus
            exit 1
          fi

          echo "== Verify Grafana =="
          GRAFANA_READY=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/grafana-health.json 2>/dev/null; then
              GRAFANA_READY=1
              break
            fi
            sleep 2
          done
          if [ "$GRAFANA_READY" -ne 1 ]; then
            echo "ERROR: Grafana did not become ready"
            dc logs --tail=150 grafana
            exit 1
          fi

          cat /tmp/grafana-health.json
          echo
          dc ps

          echo "== Record current release =="
          ln -sfn "$RELEASE_ROOT" "$DEPLOY_STATE/current"
          printf '%s\n' "$DEPLOY_SHA" > "$RELEASE_ROOT/DEPLOYED_GIT_SHA"

          echo "== Remove old CI/CD releases, keep newest 5 =="
          find "$RELEASES" -maxdepth 1 -mindepth 1 -type d -name 'madhushala-20*' -printf '%T@ %p\n' \
            | sort -nr \
            | tail -n +6 \
            | cut -d' ' -f2- \
            | xargs -r rm -rf

          echo "Deployment complete: $DEPLOY_SHA"
          REMOTE

      - name: Diagnose public origin listener
        env:
          SERVER_HOST: integrations.madhushalasoftware.com
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY_B64 }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${SERVER_PORT:-22}"
          if [ ! -f ~/.ssh/madhushala_deploy_key ]; then
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            printf '%s' "$SERVER_SSH_KEY_B64" | base64 --decode > ~/.ssh/madhushala_deploy_key
            chmod 600 ~/.ssh/madhushala_deploy_key
          fi
          ssh \
            -i ~/.ssh/madhushala_deploy_key \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE_DIAG'
          set -euo pipefail
          HOSTNAME_FQDN="integrations.madhushalasoftware.com"
          PRIVATE_IPV4="$(hostname -I | awk '{print $1}')"
          echo "HOSTNAME=$(hostname)"
          echo "PRIVATE_IPV4=$PRIVATE_IPV4"

          IMDS_TOKEN="$(curl -fsS -m 2 -X PUT \
            -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' \
            http://169.254.169.254/latest/api/token 2>/dev/null || true)"
          if [ -n "$IMDS_TOKEN" ]; then
            PUBLIC_IPV4="$(curl -fsS -m 2 \
              -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
              http://169.254.169.254/latest/meta-data/public-ipv4 2>/dev/null || true)"
            INSTANCE_ID="$(curl -fsS -m 2 \
              -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
              http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null || true)"
            echo "INSTANCE_ID=$INSTANCE_ID"
            echo "PUBLIC_IPV4=$PUBLIC_IPV4"
          else
            echo "PUBLIC_IPV4=metadata-unavailable"
          fi

          echo "LISTENERS_443:"
          sudo -n ss -ltnp | grep ':443' || true
          echo "LISTENERS_8091:"
          sudo -n ss -ltnp | grep ':8091' || true
          echo "DOCKER_8091:"
          docker ps --no-trunc --format '{{.ID}} {{.Image}} {{.Names}} {{.Ports}}' | grep '8091' || true

          show_scripts() {
            label="$1"
            shift
            echo "$label"
            HTML="$("$@" 2>/dev/null || true)"
            printf '%s' "$HTML" | grep -oE '<script[^>]+src="[^"]+"' || true
            if printf '%s' "$HTML" | grep -q 'mapping-row-identity.js?v=20260920-direct-flow-v4' \
              && printf '%s' "$HTML" | grep -q 'continueExtractedDocumentToMapping'; then
              echo "$label => CURRENT"
            else
              echo "$label => OLD_OR_OTHER"
            fi
          }

          show_scripts "DIRECT_GATEWAY_HTTP" \
            curl -fsSL "http://127.0.0.1:8091/document-import?diag=direct-gateway"

          show_scripts "LOOPBACK_HTTPS" \
            curl -kfsSL --resolve "$HOSTNAME_FQDN:443:127.0.0.1" \
            "https://$HOSTNAME_FQDN/excise-import/document-import?diag=loopback"

          show_scripts "PRIVATE_INTERFACE_HTTPS" \
            curl -kfsSL --resolve "$HOSTNAME_FQDN:443:$PRIVATE_IPV4" \
            "https://$HOSTNAME_FQDN/excise-import/document-import?diag=private"

          show_scripts "PUBLIC_DNS_FROM_ORIGIN" \
            curl -kfsSL \
            "https://$HOSTNAME_FQDN/excise-import/document-import?diag=public"

          echo "NGINX_INTEGRATIONS_REFERENCES:"
          sudo -n nginx -T 2>/dev/null \
            | grep -n -B 8 -A 90 'server_name.*integrations\.madhushalasoftware\.com' \
            || true

          echo "NGINX_CACHE_DIRECTIVES:"
          sudo -n nginx -T 2>/dev/null \
            | grep -nE 'proxy_cache|fastcgi_cache|cache_path|proxy_store|expires|Cache-Control' \
            || true

          echo "LOOPBACK_RESPONSE_HEADERS:"
          curl -kfsSI --resolve "$HOSTNAME_FQDN:443:127.0.0.1" \
            "https://$HOSTNAME_FQDN/excise-import/document-import?diag=headers-loopback" \
            || true

          echo "DIRECT_GATEWAY_RESPONSE_HEADERS:"
          curl -fsSI "http://127.0.0.1:8091/document-import?diag=headers-gateway" || true
          REMOTE_DIAG

      - name: Verify externally served frontend
        env:
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(printf '%s' "$TARGET_COMMIT" | cut -c1-8)"
          PUBLIC_URL="https://integrations.madhushalasoftware.com/excise-import"

          echo "== Public DNS addresses seen by GitHub Actions =="
          getent ahostsv4 integrations.madhushalasoftware.com || true
          getent ahostsv6 integrations.madhushalasoftware.com || true

          is_current_frontend() {
            printf '%s' "$1" | grep -q 'mapping-row-identity.js?v=20260920-direct-flow-v4' \
              && printf '%s' "$1" | grep -q 'continueExtractedDocumentToMapping'
          }

          READY=0
          for attempt in $(seq 1 20); do
            HTML="$(curl -fsSL \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "$PUBLIC_URL/document-import?deploy=$SHORT_SHA-$attempt")"
            if is_current_frontend "$HTML"; then
              READY=1
              break
            fi
            sleep 3
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: external public URL is not serving $TARGET_COMMIT"
            echo "Default public response scripts:"
            printf '%s' "$HTML" | grep -oE '<script[^>]+src="[^"]+"' || true

            echo "== IPv4 diagnostic =="
            HTML4="$(curl -4 -fsSL \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "$PUBLIC_URL/document-import?deploy=$SHORT_SHA-ipv4" 2>/dev/null || true)"
            if [ -n "$HTML4" ]; then
              if is_current_frontend "$HTML4"; then
                echo "IPv4 serves the CURRENT release."
              else
                echo "IPv4 serves an OLD/OTHER release."
              fi
              printf '%s' "$HTML4" | grep -oE '<script[^>]+src="[^"]+"' || true
            else
              echo "No usable IPv4 response."
            fi

            echo "== IPv6 diagnostic =="
            HTML6="$(curl -6 -fsSL \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "$PUBLIC_URL/document-import?deploy=$SHORT_SHA-ipv6" 2>/dev/null || true)"
            if [ -n "$HTML6" ]; then
              if is_current_frontend "$HTML6"; then
                echo "IPv6 serves the CURRENT release."
              else
                echo "IPv6 serves an OLD/OTHER release."
              fi
              printf '%s' "$HTML6" | grep -oE '<script[^>]+src="[^"]+"' || true
            else
              echo "No usable IPv6 response."
            fi

            echo "The application container and local Nginx were verified earlier in this job."
            echo "If they are current while this public check is old, DNS/CDN/upstream routing points at another origin and must be corrected there."
            exit 1
          fi

          curl -fsS "$PUBLIC_URL/health/ready" >/dev/null
