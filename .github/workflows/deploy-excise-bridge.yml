name: Deploy Excise Bridge

on:
  pull_request:
    branches: [master]
  # Every merge to master must create a verified production release.
  # Path filters previously allowed a master merge to have no deploy run.
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: madhushala-excise-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: madhushala-excise-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: madhushala-excise-bridge/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall -q app

      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-placeholder-password
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml config >/dev/null
          rm -f .env

      - name: Verify photographed QR decoder regression
        run: pytest -q tests/test_haryana_qr_photo_decode.py tests/test_haryana_qr_l34.py

      - name: Run tests
        run: pytest -q

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy tested master commit through existing VPS SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST || '13.232.52.191' }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '2223' }}
          SERVER_SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY_B64"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SERVER_SSH_KEY_B64" | base64 --decode > ~/.ssh/madhushala_deploy_key
          chmod 600 ~/.ssh/madhushala_deploy_key
          ASSET_VERSION="$(sed -nE 's/^STATIC_ASSET_VERSION = "([^"]+)".*/\1/p' madhushala-excise-bridge/app/main.py)"
          test -n "$ASSET_VERSION"
          ssh -i ~/.ssh/madhushala_deploy_key -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            -o BatchMode=yes -o ConnectTimeout=20 "$SERVER_USER@$SERVER_HOST" \
            "TARGET_COMMIT=$GITHUB_SHA EXPECTED_ASSET_VERSION=$ASSET_VERSION bash -s" \
            < madhushala-excise-bridge/scripts/deploy-production.sh
      - name: Verify public release SHA and frontend
        env:
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          URL=https://integrations.madhushalasoftware.com/excise-import
          curl -fsS --retry 3 "$URL/health/ready" > /tmp/public-health.json
          python -c 'import json,os; assert json.load(open("/tmp/public-health.json"))["gitSha"] == os.environ["TARGET_COMMIT"]'
          ASSET_VERSION="$(sed -nE 's/^STATIC_ASSET_VERSION = "([^"]+)".*/\1/p' madhushala-excise-bridge/app/main.py)"
          curl -fsS -H 'Cache-Control: no-cache' "$URL/document-import?deploy=$TARGET_COMMIT" > /tmp/public.html
          grep -Fq "mapping-row-identity.js?v=$ASSET_VERSION" /tmp/public.html
          if grep -Eiq 'PyMuPDF|LlamaParse|RapidOCR|ZXing' /tmp/public.html; then
            echo 'Internal extraction technology leaked in frontend'
            exit 1
          fi
