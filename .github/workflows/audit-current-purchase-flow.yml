name: Audit Current Purchase Flow

on:
  push:
    branches:
      - feat/purchase-orchestration-platform
    paths:
      - ".github/workflows/audit-current-purchase-flow.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact purchase calculation contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://reportapi.madhushalasoftware.com'
          curl -k -fsSL "$BASE/swagger/v1/swagger.json" -o /tmp/swagger.json
          python - <<'PY'
          import json
          api=json.load(open('/tmp/swagger.json'))
          schemas=api.get('components',{}).get('schemas',{})
          wanted=(
            'Madhushala.Core.DTOs.Transaction.Purchase.PurchaseCalculationRequest',
            'Madhushala.Core.DTOs.Transaction.Purchase.PurchaseItemCalcRequest',
            'Madhushala.Core.DTOs.Transaction.Purchase.PurchaseRequest',
            'Madhushala.Core.DTOs.Transaction.Purchase.PurchaseItemRequest',
            'Madhushala.Core.DTOs.Transaction.Purchase.PurchaseTaxRequest',
          )
          for name in wanted:
              print('\n##', name)
              print(json.dumps(schemas.get(name,{}), indent=2))
          print('\n=== schemas with purchase calc/result names ===')
          for name,schema in sorted(schemas.items()):
              low=name.lower()
              if 'purchase' in low and any(k in low for k in ('calc','result','response')):
                  print('\n##',name)
                  print(json.dumps(schema,indent=2)[:20000])
          PY
