name: Validate Purchase Orchestration V2 Final

on:
  push:
    branches:
      - refactor/purchase-orchestration-v2
    paths:
      - ".github/workflows/validate-purchase-orchestration-v2-final.yml"

permissions:
  contents: write

jobs:
  refactor-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/purchase-orchestration-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply remaining application refactor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path("madhushala-excise-bridge")
          path = root / "app/modules/document_import/service.py"
          text = path.read_text()
          old_import = "from app.modules.document_import.purchase_context import build_purchase_context\n"
          new_import = "from app.modules.document_import.purchase_items import build_purchase_items\nfrom app.modules.document_import.purchase_orchestrator import PurchaseOrchestrator\n"
          if old_import not in text:
              raise SystemExit("service import anchor not found")
          text = text.replace(old_import, new_import, 1)
          old_rate = '"salesTaxRate": _money(header.get("salesTaxRate") or payload.get("salesTaxOnMRP") or 0),'
          if old_rate not in text:
              raise SystemExit("salesTaxRate anchor not found")
          text = text.replace(old_rate, '"salesTaxRate": _money(header.get("salesTaxRate") or 0),', 1)
          start = text.index("    async def _purchase_items_for_job")
          methods = "    async def _purchase_items_for_job(self, session: dict[str, Any], job_id: str) -> list[dict[str, Any]]:\n        return await build_purchase_items(self, session, job_id)\n\n    async def preview_purchase(self, session: dict[str, Any], job_id: str, header: dict[str, Any]) -> dict[str, Any]:\n        return await PurchaseOrchestrator(self).preview(session, job_id, header)\n\n    async def save_purchase(self, session: dict[str, Any], job_id: str, header: dict[str, Any]) -> dict[str, Any]:\n        return await PurchaseOrchestrator(self).save(session, job_id, header)\n"
          path.write_text(text[:start] + methods)

          path = root / "app/main.py"
          main = path.read_text()
          if "import time\n" not in main:
              main = main.replace("import secrets\n", "import secrets\nimport time\n", 1)
          main = main.replace("from app.integrations.madhushala.client import MadhushalaApiError, MadhushalaClient\n", "from app.integrations.madhushala.client import MadhushalaApiError, MadhushalaClient\nfrom app.integrations.madhushala.cache import madhushala_cache\nfrom app.observability import bind_request_id, configure_logging, current_request_id, reset_request_id\n", 1)
          main = main.replace('logging.basicConfig(level=logging.INFO, format="%(asctime)s - %(name)s - %(levelname)s - %(message)s")\n', 'configure_logging(logging.INFO)\n', 1)
          old_lifespan = "@asynccontextmanager\nasync def lifespan(_app: FastAPI):\n    settings.validate_production()\n    init_db()\n    session_service.cleanup_expired()\n    await mapping_service.initialize()\n    logger.info(\"Madhushala Automation Platform started env=%s\", settings.APP_ENV)\n    yield\n"
          new_lifespan = "@asynccontextmanager\nasync def lifespan(_app: FastAPI):\n    settings.validate_production()\n    init_db()\n    session_service.cleanup_expired()\n    await mapping_service.initialize()\n    logger.info(\"event=application_started env=%s\", settings.APP_ENV)\n    try:\n        yield\n    finally:\n        await madhushala_cache.close()\n        await MadhushalaClient.close_shared_client()\n        logger.info(\"event=application_stopped\")\n"
          if old_lifespan not in main:
              raise SystemExit("lifespan anchor not found")
          main = main.replace(old_lifespan, new_lifespan, 1)
          main = main.replace('version="2.1.1",', 'version="2.2.0",', 1)
          main = main.replace('allow_headers=["Authorization", "Content-Type", "X-CRM-Integration-Key"],', 'allow_headers=["Authorization", "Content-Type", "X-CRM-Integration-Key", "X-Request-ID"],', 1)
          main = main.replace('return {"status": "ready", "version": "2.1.1"}', 'return {"status": "ready", "version": "2.2.0"}', 1)
          middleware = "\n@app.middleware(\"http\")\nasync def request_observability(request: Request, call_next):\n    token = bind_request_id(request.headers.get(\"X-Request-ID\"))\n    started = time.perf_counter()\n    status_code = 500\n    try:\n        response = await call_next(request)\n        status_code = response.status_code\n        response.headers[\"X-Request-ID\"] = current_request_id()\n        return response\n    finally:\n        elapsed_ms = round((time.perf_counter() - started) * 1000, 1)\n        logger.info(\"event=http_request method=%s path=%s status=%s elapsedMs=%s\", request.method, request.url.path, status_code, elapsed_ms)\n        reset_request_id(token)\n\n"
          anchor = "if not settings.is_production:\n"
          if "async def request_observability" not in main:
              if anchor not in main:
                  raise SystemExit("middleware anchor not found")
              main = main.replace(anchor, middleware + anchor, 1)
          path.write_text(main)

          path = root / ".env.example"
          env = path.read_text()
          if "MADHUSHALA_MAX_CONNECTIONS=" not in env:
              lines = [
                  "", "# Madhushala pooled HTTP client",
                  "MADHUSHALA_CONNECT_TIMEOUT_SECONDS=5", "MADHUSHALA_READ_TIMEOUT_SECONDS=30",
                  "MADHUSHALA_WRITE_TIMEOUT_SECONDS=30", "MADHUSHALA_POOL_TIMEOUT_SECONDS=5",
                  "MADHUSHALA_MAX_CONNECTIONS=100", "MADHUSHALA_MAX_KEEPALIVE_CONNECTIONS=20",
                  "MADHUSHALA_MAX_CONCURRENCY=20", "MADHUSHALA_ITEM_FETCH_CONCURRENCY=8",
                  "MADHUSHALA_READ_RETRY_ATTEMPTS=3", "MADHUSHALA_RETRY_BASE_DELAY_SECONDS=0.15",
                  "MADHUSHALA_CIRCUIT_FAILURE_THRESHOLD=5", "MADHUSHALA_CIRCUIT_OPEN_SECONDS=20",
                  "", "# Optional shared Redis cache; blank uses the in-process TTL cache",
                  "REDIS_URL=", "MADHUSHALA_CACHE_PREFIX=madhushala",
                  "MADHUSHALA_MASTER_CACHE_TTL_SECONDS=3600", "MADHUSHALA_USER_CACHE_TTL_SECONDS=1800",
                  "MADHUSHALA_SCHEME_CACHE_TTL_SECONDS=900", "MADHUSHALA_CONFIG_CACHE_TTL_SECONDS=10800",
                  "MADHUSHALA_ITEM_CACHE_TTL_SECONDS=21600", "",
              ]
              env = env.rstrip() + "\n" + "\n".join(lines)
          path.write_text(env)
          PY
      - name: Install dependencies
        working-directory: madhushala-excise-bridge
        run: pip install -r requirements.txt
      - name: Compile Python
        working-directory: madhushala-excise-bridge
        run: python -m compileall -q app tests
      - name: Validate browser JavaScript
        working-directory: madhushala-excise-bridge
        run: node --check app/static/purchase-context.js && node --check app/static/mapping-row-identity.js
      - name: Run complete test suite
        working-directory: madhushala-excise-bridge
        run: pytest -q
      - name: Commit tested application changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Koushik Biswas"
          git config user.email "k.kbiswas8@gmail.com"
          git add madhushala-excise-bridge/app madhushala-excise-bridge/tests madhushala-excise-bridge/.env.example madhushala-excise-bridge/requirements.txt
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "Complete production purchase orchestration refactor"
            git push origin HEAD:refactor/purchase-orchestration-v2
          fi
