name: Audit Madhushala Purchase API

on:
  push:
    branches:
      - fix/purchase-required-fields
    paths:
      - ".github/workflows/audit-purchase-api.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Trace purchase calculation config sources
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://reportapi.madhushalasoftware.com'
          curl -k -fsSL "$BASE/swagger/v1/swagger.json" -o /tmp/swagger.json
          python - <<'PY'
          import json
          api=json.load(open('/tmp/swagger.json'))
          paths=api.get('paths',{})
          schemas=api.get('components',{}).get('schemas',{})

          needles=('salestaxrate','salestaxincludingfree','salestaxonmrp','purchasetaxmode','yearcode')
          print('=== PATHS CONTAINING PURCHASE CALC/YEAR SIGNALS ===')
          for path, methods in sorted(paths.items()):
              text=json.dumps(methods).lower()
              hits=[n for n in needles if n in text]
              if hits:
                  print('\n###',path,'hits=',','.join(hits))
                  print(json.dumps(methods,indent=2)[:16000])

          print('\n=== SCHEMAS CONTAINING PURCHASE CALC/YEAR SIGNALS ===')
          for name, schema in sorted(schemas.items()):
              text=json.dumps(schema).lower()
              hits=[n for n in needles if n in text]
              if hits:
                  print('\n##',name,'hits=',','.join(hits))
                  print(json.dumps(schema,indent=2)[:14000])
          PY
