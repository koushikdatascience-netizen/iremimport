name: Audit Madhushala Purchase API

on:
  push:
    branches:
      - fix/purchase-required-fields
    paths:
      - ".github/workflows/audit-purchase-api.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact purchase dependencies
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://reportapi.madhushalasoftware.com'
          curl -k -fsSL "$BASE/swagger/v1/swagger.json" -o /tmp/swagger.json
          python - <<'PY'
          import json
          api = json.load(open('/tmp/swagger.json'))
          paths = api.get('paths', {})
          schemas = api.get('components', {}).get('schemas', {})

          exact = [
              '/api/purchase/dropdown/company',
              '/api/purchase/dropdown/items',
              '/api/purchase/dropdown/suppliers',
              '/api/purchase/dropdown/storages',
              '/api/purchase/dropdown/purchase-accounts',
              '/api/purchase/dropdown/schemes',
              '/api/counter-sales/users',
              '/api/companies/purchase-tax-mode',
              '/api/purchase/calculate',
              '/api/TaxTag/ShowTaxTag',
              '/api/TaxTag/by-TaxCode/{code}',
              '/api/purchase/check-duplicate-billno',
              '/api/purchase/save',
              '/api/items/{code}',
          ]
          print('=== EXACT PURCHASE DEPENDENCY ENDPOINTS ===')
          for path in exact:
              print('\n###', path)
              print(json.dumps(paths.get(path), indent=2)[:18000])

          print('\n=== PATHS THAT REFERENCE CompanyItem / YearCodeItem ===')
          targets = ('Madhushala.Core.DTOs.Auth.CompanyItem','Madhushala.Core.DTOs.Auth.YearCodeItem')
          for path, methods in paths.items():
              text = json.dumps(methods)
              if any(t in text for t in targets):
                  print('\n###', path)
                  print(json.dumps(methods, indent=2)[:12000])

          print('\n=== EXACT SCHEMAS ===')
          names = [
              'Madhushala.Core.DTOs.Auth.CompanyItem',
              'Madhushala.Core.DTOs.Auth.YearCodeItem',
              'Madhushala.Core.DTOs.Transaction.Purchase.PurchaseRequest',
              'Madhushala.Core.DTOs.Transaction.Purchase.PurchaseItemRequest',
              'Madhushala.Core.DTOs.Transaction.Purchase.PurchaseTaxRequest',
              'Madhushala.Core.DTOs.Transaction.Purchase.PurchaseCalculationRequest',
              'Madhushala.Core.DTOs.Transaction.Purchase.PurchaseItemCalcRequest',
              'Madhushala.Core.DTOs.Master.TaxTag.TaxTagSaveRequest',
          ]
          for name in names:
              print('\n##', name)
              print(json.dumps(schemas.get(name), indent=2)[:16000])
          PY
