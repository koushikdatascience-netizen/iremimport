name: Audit Madhushala Purchase API

on:
  push:
    branches:
      - fix/purchase-required-fields
    paths:
      - ".github/workflows/audit-purchase-api.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Trace session and company purchase config endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://reportapi.madhushalasoftware.com'
          curl -k -fsSL "$BASE/swagger/v1/swagger.json" -o /tmp/swagger.json
          python - <<'PY'
          import json
          api=json.load(open('/tmp/swagger.json'))
          paths=api.get('paths',{})

          print('=== SESSION DATA RESPONSE REFERENCES ===')
          for path, methods in sorted(paths.items()):
              text=json.dumps(methods)
              if 'SessionDataResponse' in text or 'AuthResponse' in text and '/api/auth/' in path:
                  print('\n###',path)
                  print(json.dumps(methods,indent=2)[:16000])

          print('\n=== COMPANY / CONFIG / TAX PATH NAMES ===')
          for path, methods in sorted(paths.items()):
              low=path.lower()
              if any(k in low for k in ('compan','param','config','setting','tax','scheme')):
                  print('\n###',path)
                  print(json.dumps(methods,indent=2)[:10000])
          PY
