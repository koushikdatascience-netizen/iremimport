name: Validate Purchase Orchestration V2 Tests

on:
  push:
    branches:
      - refactor/purchase-orchestration-v2
    paths:
      - ".github/workflows/validate-purchase-orchestration-v2-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/purchase-orchestration-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: madhushala-excise-bridge
        run: pip install -r requirements.txt
      - name: Compile Python
        working-directory: madhushala-excise-bridge
        run: python -m compileall -q app tests
      - name: Validate browser JavaScript
        working-directory: madhushala-excise-bridge
        run: node --check app/static/purchase-context.js && node --check app/static/mapping-row-identity.js
      - name: Run complete test suite
        working-directory: madhushala-excise-bridge
        run: pytest -q
