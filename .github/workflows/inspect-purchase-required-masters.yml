name: Inspect purchase required masters
on:
  push:
    branches: [fix/purchase-save-contract]
    paths: [.github/workflows/inspect-purchase-required-masters.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Swagger purchase master endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl -k -fsSL https://reportapi.madhushalasoftware.com/swagger/v1/swagger.json -o /tmp/api.json
          python - <<'PY'
          import json
          api=json.load(open('/tmp/api.json'))
          paths=api.get('paths',{})
          needles=('scheme','supplier','storage','store','purchase-account','purchaseaccount')
          selected=[]
          for p,node in paths.items():
              low=p.lower()
              if any(n in low for n in needles):
                  selected.append((p,node))
          for p,node in selected:
              print('\n===',p,'===')
              print(json.dumps(node,indent=2)[:12000])
          refs=set()
          def walk(v):
              if isinstance(v,dict):
                  for k,x in v.items():
                      if k=='$ref' and isinstance(x,str): refs.add(x)
                      else: walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          for _,node in selected: walk(node)
          schemas=api.get('components',{}).get('schemas',{})
          seen=set()
          while refs:
              ref=refs.pop(); name=ref.rsplit('/',1)[-1]
              if name in seen: continue
              seen.add(name)
              schema=schemas.get(name)
              print('\n=== SCHEMA',name,'===')
              print(json.dumps(schema,indent=2)[:10000])
              walk(schema)
          PY
