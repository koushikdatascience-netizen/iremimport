name: Load Test Baseline

on:
  push:
    branches:
      - master
    paths:
      - "madhushala-excise-bridge/loadtest/**"
      - ".github/workflows/load-test-baseline.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target base URL"
        required: false
        default: "https://excise.connect.snapkey.in"

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run controlled k6 baseline
        env:
          BASE_URL: ${{ inputs.base_url || 'https://excise.connect.snapkey.in' }}
        run: |
          docker run --rm \
            -e BASE_URL="$BASE_URL" \
            -v "$PWD/madhushala-excise-bridge/loadtest:/scripts:ro" \
            grafana/k6:0.54.0 run --summary-export=/tmp/summary.json /scripts/baseline.js
