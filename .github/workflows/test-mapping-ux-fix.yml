name: Test Mapping UX Fix

on:
  push:
    branches:
      - fix/document-mapping-ux-persistence
    paths:
      - "madhushala-excise-bridge/**"
      - ".github/workflows/test-mapping-ux-fix.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: madhushala-excise-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: madhushala-excise-bridge/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Check mapping JavaScript syntax
        run: |
          node --check app/static/mapping-row-identity.js
          node --check app/static/purchase-context.js
      - name: Run tests
        run: pytest -q
