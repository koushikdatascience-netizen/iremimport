name: Test QR Review and Excise Flow

on:
  push:
    branches:
      - fix/qr-review-and-excise-save-order

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: madhushala-excise-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Check mapping JavaScript
        run: node --check app/static/mapping-row-identity.js
      - name: Run tests
        run: pytest -q
