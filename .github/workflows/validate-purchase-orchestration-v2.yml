name: Validate Purchase Orchestration V2

on:
  push:
    branches:
      - refactor/purchase-orchestration-v2
    paths:
      - ".github/workflows/validate-purchase-orchestration-v2.yml"

permissions:
  contents: write

jobs:
  refactor-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/purchase-orchestration-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply service and observability refactor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path("madhushala-excise-bridge")
          service_path = root / "app/modules/document_import/service.py"
          text = service_path.read_text()

          old_import = "from app.modules.document_import.purchase_context import build_purchase_context\n"
          new_import = (
              "from app.integrations.madhushala.masters import MadhushalaMasterService\n"
              "from app.modules.document_import.purchase_orchestrator import PurchaseOrchestrator\n"
          )
          if old_import not in text:
              raise SystemExit("service import anchor not found")
          text = text.replace(old_import, new_import, 1)

          old_rate = '"salesTaxRate": _money(header.get("salesTaxRate") or payload.get("salesTaxOnMRP") or 0),'
          new_rate = '"salesTaxRate": _money(header.get("salesTaxRate") or 0),'
          if old_rate not in text:
              raise SystemExit("salesTaxRate anchor not found")
          text = text.replace(old_rate, new_rate, 1)

          start = text.index("    async def _purchase_items_for_job")
          save_start = text.index("    async def save_purchase", start)
          new_purchase_items = r'''    async def _purchase_items_for_job(self, session: dict[str, Any], job_id: str) -> list[dict[str, Any]]:
              self.get_job(session, job_id)
              bill_type = str(session.get("bill_type") or "AI").strip() or "AI"
              records: list[tuple[dict[str, Any], dict[str, Any], str]] = []
              missing: list[str] = []

              with conn() as db:
                  rows = db.execute("SELECT * FROM import_items WHERE job_id=? ORDER BY created_at, id", (job_id,)).fetchall()
                  for raw_row in rows:
                      row = dict(raw_row)
                      try:
                          raw_data = json.loads(row.get("raw_data_json") or "{}")
                      except Exception:
                          raw_data = {}
                      if not isinstance(raw_data, dict):
                          raw_data = {}

                      mapped = str(row.get("mapped_item_code") or "").strip()
                      if not mapped and row.get("excise_item_code"):
                          map_row = db.execute(
                              "SELECT madhushala_item_code FROM mappings WHERE shop_code=? AND excise_item_code=?",
                              (session["shop_code"], str(row["excise_item_code"])),
                          ).fetchone()
                          mapped = str(map_row["madhushala_item_code"] if map_row else "").strip()
                      if not mapped:
                          missing.append(str(row.get("raw_name") or row.get("normalized_name") or row.get("id")))
                          continue
                      records.append((row, raw_data, mapped))

              if missing:
                  raise HTTPException(status_code=409, detail=f"Map all items before saving purchase: {', '.join(missing[:5])}")
              if not records:
                  raise HTTPException(status_code=400, detail="No items available for purchase save")

              master = MadhushalaMasterService(session)
              catalogue = await master.purchase_items_by_codes([mapped for _, _, mapped in records])
              catalogue_by_code = {
                  str(self._catalogue_value(item, "itemCode", "code", "value", "id") or "").strip(): item
                  for item in catalogue
                  if isinstance(item, dict)
              }

              items: list[dict[str, Any]] = []
              for row, raw_data, mapped in records:
                  raw_normalized = {self._catalogue_key(key): value for key, value in raw_data.items()}

                  def raw_value(*aliases: str) -> Any:
                      for alias in aliases:
                          value = raw_normalized.get(self._catalogue_key(alias))
                          if value not in (None, ""):
                              return value
                      return None

                  def raw_money(*aliases: str, fallback: Any = None) -> float:
                      value = raw_value(*aliases)
                      return _money(fallback if value in (None, "") else value)

                  def raw_int(*aliases: str, fallback: Any = None) -> int:
                      value = raw_value(*aliases)
                      return _int_value(fallback if value in (None, "") else value)

                  fallback_name = str(row.get("normalized_name") or row.get("raw_name") or mapped)
                  catalogue_item = catalogue_by_code.get(mapped) or {"itemCode": mapped}
                  catalogue_packing = self._catalogue_int(
                      catalogue_item, "packing", "bottlePerCase", "bottlesPerCase", "caseQty"
                  )

                  packing = raw_int(
                      "packing", "bottlePerCase", "bottlesPerCase", "caseQty",
                      fallback=row.get("packing") or catalogue_packing,
                  )
                  box = raw_int("box", "boxes", "case", "cases", fallback=row.get("quantity") or 1)
                  loose = raw_int("loose", "looseQty", fallback=0)
                  qnty = raw_int("qnty", "qty", "totalQty", "totalQuantity", fallback=0)
                  if not qnty:
                      qnty = (box * packing + loose) if packing else (box + loose)

                  catalogue_mrp = self._catalogue_money(catalogue_item, "mrp", "itemMrp", "mrpPerUnit")
                  unit_rate = self._catalogue_money(
                      catalogue_item, "purchaseRate", "looseRate", "bottleRate", "rate", "itemRate"
                  )
                  case_rate = self._catalogue_money(
                      catalogue_item, "purchaseRateCase", "boxRate", "caseRate"
                  )
                  if not case_rate and unit_rate and packing:
                      case_rate = _money(unit_rate * packing)

                  rate = raw_money("rate", "purchaseRate", fallback=row.get("rate") or unit_rate)
                  box_rate = raw_money("boxRate", "caseRate", "purchaseRateCase", fallback=case_rate or rate)
                  loose_rate = raw_money("looseRate", "bottleRate", fallback=unit_rate or rate)
                  amount = raw_money("itemAmount", "amount", "lineAmount", "totalAmount", fallback=row.get("amount"))
                  if not amount:
                      if box_rate and box:
                          amount = _money((box_rate * box) + (loose_rate * loose))
                      elif rate and qnty:
                          amount = _money(rate * qnty)

                  item = {
                      "itemCode": mapped,
                      "itemName": self._purchase_item_name(mapped, catalogue, fallback_name),
                      "batchNo": str(raw_value("batchNo", "batch") or self._catalogue_value(catalogue_item, "batchNo", "batch") or ""),
                      "box": box,
                      "loose": loose,
                      "qnty": qnty,
                      "freeQnty": raw_int("freeQnty", "freeQty", "free", fallback=0),
                      "rate": rate or loose_rate,
                      "boxRate": box_rate or rate,
                      "looseRate": loose_rate,
                      "mrp": raw_money("mrp", fallback=row.get("mrp") or catalogue_mrp),
                      "itemAmount": amount,
                      "discount": raw_money(
                          "discount", "disc",
                          fallback=self._catalogue_money(catalogue_item, "purchaseDiscountAmount", "discount"),
                      ),
                      "cgst": raw_money("cgst", fallback=self._catalogue_money(catalogue_item, "cgst")),
                      "sgst": raw_money("sgst", fallback=self._catalogue_money(catalogue_item, "sgst")),
                      "cess": raw_money("cess", fallback=self._catalogue_money(catalogue_item, "cess")),
                      "addCess": raw_money(
                          "addCess", "adCess", "additionalCess",
                          fallback=self._catalogue_money(catalogue_item, "addCess", "adCess"),
                      ),
                      "igst": raw_money("igst", fallback=self._catalogue_money(catalogue_item, "igst")),
                      "t1Amt": raw_money("t1Amt", "t1", fallback=self._catalogue_money(catalogue_item, "t1Amt")),
                      "t2Amt": raw_money("t2Amt", "t2", fallback=self._catalogue_money(catalogue_item, "t2Amt")),
                      "t3Amt": raw_money("t3Amt", "t3", fallback=self._catalogue_money(catalogue_item, "t3Amt")),
                      "t4Amt": raw_money("t4Amt", "t4", fallback=self._catalogue_money(catalogue_item, "t4Amt")),
                      "etd": raw_money("etd", fallback=self._catalogue_money(catalogue_item, "etd")),
                      "cgstInptLdgr": str(raw_value("cgstInptLdgr") or self._catalogue_value(catalogue_item, "cgstInptLdgr") or ""),
                      "sgstInptLdgr": str(raw_value("sgstInptLdgr") or self._catalogue_value(catalogue_item, "sgstInptLdgr") or ""),
                      "cessInptLdgr": str(raw_value("cessInptLdgr") or self._catalogue_value(catalogue_item, "cessInptLdgr") or ""),
                      "adCessInptLdgr": str(raw_value("adCessInptLdgr", "addCessInptLdgr") or self._catalogue_value(catalogue_item, "adCessInptLdgr", "addCessInptLdgr") or ""),
                      "igstInptLdgr": str(raw_value("igstInptLdgr") or self._catalogue_value(catalogue_item, "igstInptLdgr") or ""),
                      "packing": packing,
                      "t1Rate": raw_money("t1Rate", fallback=self._catalogue_money(catalogue_item, "t1Rate")),
                      "t2Rate": raw_money("t2Rate", fallback=self._catalogue_money(catalogue_item, "t2Rate")),
                      "t3Rate": raw_money("t3Rate", fallback=self._catalogue_money(catalogue_item, "t3Rate")),
                      "t4Rate": raw_money("t4Rate", fallback=self._catalogue_money(catalogue_item, "t4Rate")),
                  }
                  items.append(item)
              return items

          '''
          text = text[:start] + new_purchase_items + text[save_start:]

          save_start = text.index("    async def save_purchase", start)
          new_tail = r'''    async def preview_purchase(self, session: dict[str, Any], job_id: str, header: dict[str, Any]) -> dict[str, Any]:
              return await PurchaseOrchestrator(self).preview(session, job_id, header)

              async def save_purchase(self, session: dict[str, Any], job_id: str, header: dict[str, Any]) -> dict[str, Any]:
              return await PurchaseOrchestrator(self).save(session, job_id, header)
          '''
          # Correct indentation of the generated tail explicitly.
          new_tail = new_tail.replace("              async def save_purchase", "    async def save_purchase")
          text = text[:save_start] + new_tail
          service_path.write_text(text)

          # Main application: request correlation/timing and clean pooled-client/cache shutdown.
          main_path = root / "app/main.py"
          main = main_path.read_text()
          main = main.replace("import secrets\n", "import secrets\nimport time\n", 1)
          main = main.replace(
              "from app.integrations.madhushala.client import MadhushalaApiError, MadhushalaClient\n",
              "from app.integrations.madhushala.client import MadhushalaApiError, MadhushalaClient\n"
              "from app.integrations.madhushala.cache import madhushala_cache\n"
              "from app.observability import bind_request_id, configure_logging, current_request_id, reset_request_id\n",
              1,
          )
          old_logging = 'logging.basicConfig(level=logging.INFO, format="%(asctime)s - %(name)s - %(levelname)s - %(message)s")\nlogger = logging.getLogger("madhushala-excise-bridge")\n'
          new_logging = 'configure_logging(logging.INFO)\nlogger = logging.getLogger("madhushala-excise-bridge")\n'
          if old_logging not in main:
              raise SystemExit("main logging anchor not found")
          main = main.replace(old_logging, new_logging, 1)

          old_lifespan = '''@asynccontextmanager
          async def lifespan(_app: FastAPI):
              settings.validate_production()
              init_db()
              session_service.cleanup_expired()
              await mapping_service.initialize()
              logger.info("Madhushala Automation Platform started env=%s", settings.APP_ENV)
              yield
          '''.replace("          ", "")
          new_lifespan = '''@asynccontextmanager
          async def lifespan(_app: FastAPI):
              settings.validate_production()
              init_db()
              session_service.cleanup_expired()
              await mapping_service.initialize()
              logger.info("event=application_started env=%s", settings.APP_ENV)
              try:
                  yield
              finally:
                  await madhushala_cache.close()
                  await MadhushalaClient.close_shared_client()
                  logger.info("event=application_stopped")
          '''.replace("          ", "")
          if old_lifespan not in main:
              raise SystemExit("lifespan anchor not found")
          main = main.replace(old_lifespan, new_lifespan, 1)
          main = main.replace('version="2.1.1",', 'version="2.2.0",', 1)
          main = main.replace('return {"status": "ready", "version": "2.1.1"}', 'return {"status": "ready", "version": "2.2.0"}', 1)
          main = main.replace(
              'allow_headers=["Authorization", "Content-Type", "X-CRM-Integration-Key"],',
              'allow_headers=["Authorization", "Content-Type", "X-CRM-Integration-Key", "X-Request-ID"],',
              1,
          )

          middleware = '''
          @app.middleware("http")
          async def request_observability(request: Request, call_next):
              token = bind_request_id(request.headers.get("X-Request-ID"))
              started = time.perf_counter()
              status_code = 500
              try:
                  response = await call_next(request)
                  status_code = response.status_code
                  response.headers["X-Request-ID"] = current_request_id()
                  return response
              finally:
                  elapsed_ms = round((time.perf_counter() - started) * 1000, 1)
                  logger.info(
                      "event=http_request method=%s path=%s status=%s elapsedMs=%s",
                      request.method,
                      request.url.path,
                      status_code,
                      elapsed_ms,
                  )
                  reset_request_id(token)


          '''.replace("          ", "")
          anchor = "if not settings.is_production:\n"
          if anchor not in main:
              raise SystemExit("middleware insertion anchor not found")
          main = main.replace(anchor, middleware + anchor, 1)
          main_path.write_text(main)

          # Keep the example config current without requiring Redis in today's deployment.
          env_path = root / ".env.example"
          env = env_path.read_text()
          if "MADHUSHALA_MAX_CONNECTIONS=" not in env:
              env += '''

          # Madhushala pooled HTTP client
          MADHUSHALA_CONNECT_TIMEOUT_SECONDS=5
          MADHUSHALA_READ_TIMEOUT_SECONDS=30
          MADHUSHALA_WRITE_TIMEOUT_SECONDS=30
          MADHUSHALA_POOL_TIMEOUT_SECONDS=5
          MADHUSHALA_MAX_CONNECTIONS=100
          MADHUSHALA_MAX_KEEPALIVE_CONNECTIONS=20
          MADHUSHALA_MAX_CONCURRENCY=20
          MADHUSHALA_ITEM_FETCH_CONCURRENCY=8
          MADHUSHALA_READ_RETRY_ATTEMPTS=3
          MADHUSHALA_RETRY_BASE_DELAY_SECONDS=0.15
          MADHUSHALA_CIRCUIT_FAILURE_THRESHOLD=5
          MADHUSHALA_CIRCUIT_OPEN_SECONDS=20

          # Optional shared Redis cache; blank = safe in-process cache fallback
          REDIS_URL=
          MADHUSHALA_CACHE_PREFIX=madhushala
          MADHUSHALA_MASTER_CACHE_TTL_SECONDS=3600
          MADHUSHALA_USER_CACHE_TTL_SECONDS=1800
          MADHUSHALA_SCHEME_CACHE_TTL_SECONDS=900
          MADHUSHALA_CONFIG_CACHE_TTL_SECONDS=10800
          MADHUSHALA_ITEM_CACHE_TTL_SECONDS=21600
          '''.replace("          ", "")
          env_path.write_text(env)

          # Update old required-field tests to the actual contract provided by Madhushala.
          required_test = root / "tests/test_purchase_required_fields.py"
          test_text = required_test.read_text()
          test_text = test_text.replace(
              '"schemeCode": "SCH-1",\n',
              '"schemeCode": "SCH-1",\n                "purchaseAccCode": "PUR-1",\n                "userCode": "USR-1",\n',
          )
          test_text = test_text.replace(
              'assert "Scheme" in detail\n    assert "TP Pass No" not in detail',
              'assert "Purchase A/c" in detail\n    assert "User" in detail\n    assert "Scheme" not in detail\n    assert "TP Pass No" not in detail',
          )
          required_test.write_text(test_text)

          # New orchestration regression: QR/document purchases must calculate, duplicate-check,
          # retain optional empty fields, and accept Purchase A/c/User as required masters.
          orchestration_test = root / "tests/test_purchase_orchestration_v2.py"
          orchestration_test.write_text(r'''from __future__ import annotations

          import pytest

          from app.modules.document_import import purchase_orchestrator


          class FakeClient:
              def __init__(self):
                  self.calculate_calls = 0
                  self.duplicate_calls = 0

              async def calculate_purchase(self, payload):
                  self.calculate_calls += 1
                  assert payload["items"][0]["itemCode"] == "I001"
                  return {
                      "grossAmount": 500,
                      "taxAmount": 25,
                      "netAmount": 525,
                      "items": [{
                          "itemCode": "I001",
                          "qnty": 48,
                          "rate": 10.42,
                          "mrp": 500,
                          "itemAmount": 500,
                          "discount": 0,
                          "cgst": 0,
                          "sgst": 0,
                          "cess": 0,
                          "addCess": 0,
                          "igst": 0,
                          "t1Amt": 25,
                          "t2Amt": 0,
                          "t3Amt": 0,
                          "t4Amt": 0,
                          "etd": 0,
                      }],
                  }

              async def check_duplicate_bill(self, **kwargs):
                  self.duplicate_calls += 1
                  assert kwargs["supplier_code"] == "SUP-1"
                  return {"isDuplicate": False}


          class FakeMaster:
              last = None

              def __init__(self, session):
                  self.client = FakeClient()
                  FakeMaster.last = self

              async def purchase_tax_mode(self):
                  return "ITEMWISE"

              async def tax_tags(self):
                  return []


          class FakeService:
              def get_job(self, session, job_id):
                  return {
                      "id": job_id,
                      "source_type": "QR_HTML",
                      "invoice_number": "INV-1",
                      "invoice_date": "2026-06-16",
                  }

              async def _purchase_items_for_job(self, session, job_id):
                  return [{
                      "itemCode": "I001",
                      "itemName": "Item",
                      "batchNo": "",
                      "box": 1,
                      "loose": 0,
                      "qnty": 48,
                      "freeQnty": 0,
                      "rate": 10.42,
                      "boxRate": 500,
                      "looseRate": 10.42,
                      "mrp": 500,
                      "itemAmount": 500,
                      "discount": 0,
                      "cgst": 0,
                      "sgst": 0,
                      "cess": 0,
                      "addCess": 0,
                      "igst": 0,
                      "t1Amt": 0,
                      "t2Amt": 0,
                      "t3Amt": 0,
                      "t4Amt": 0,
                      "etd": 0,
                      "packing": 48,
                      "t1Rate": 0,
                      "t2Rate": 0,
                      "t3Rate": 0,
                      "t4Rate": 0,
                      "cgstInptLdgr": "",
                      "sgstInptLdgr": "",
                      "cessInptLdgr": "",
                      "adCessInptLdgr": "",
                      "igstInptLdgr": "",
                  }]

              def _build_purchase_calculation_request(self, payload, header):
                  return {
                      "shopCode": payload["shopCode"],
                      "companyCode": payload["companyCode"],
                      "schemeCode": payload["schemeCode"],
                      "salesTaxRate": 0,
                      "salesTaxIncludingFree": False,
                      "items": [{"itemCode": "I001"}],
                  }

              def _merge_purchase_calculation(self, payload, response):
                  payload["grossAmount"] = response["grossAmount"]
                  payload["taxAmount"] = response["taxAmount"]
                  payload["netAmount"] = response["netAmount"]
                  payload["items"][0].update(response["items"][0])


          @pytest.mark.asyncio
          async def test_qr_purchase_always_calculates_and_keeps_optional_fields(monkeypatch):
              async def fake_resolve(service, session, job_id, header):
                  return {
                      **(header or {}),
                      "supplierCode": "SUP-1",
                      "storeCode": "STORE-1",
                      "purchaseAccCode": "PUR-1",
                      "userCode": "USR-1",
                      "schemeCode": "",
                      "tpPassNo": "",
                      "taxMode": "ITEMWISE",
                  }

              monkeypatch.setattr(purchase_orchestrator, "resolve_required_purchase_header", fake_resolve)
              monkeypatch.setattr(purchase_orchestrator, "MadhushalaMasterService", FakeMaster)

              orchestrator = purchase_orchestrator.PurchaseOrchestrator(FakeService())
              payload, duplicate = await orchestrator.prepare(
                  {
                      "shop_code": "SHOP-1",
                      "company_code": "01",
                      "bill_type": "AI",
                      "madhushala_token": "",
                  },
                  "job-qr",
                  {"docNo": "INV-1", "docDate": "2026-06-16", "yearCode": "2026-27"},
              )

              assert payload["tpPassNo"] == ""
              assert payload["schemeCode"] == ""
              assert payload["purchaseAccCode"] == "PUR-1"
              assert payload["userCode"] == "USR-1"
              assert payload["grossAmount"] == 500
              assert payload["taxAmount"] == 25
              assert payload["netAmount"] == 525
              assert payload["taxes"] == []
              assert FakeMaster.last.client.calculate_calls == 1
              assert FakeMaster.last.client.duplicate_calls == 1
              assert duplicate == {"isDuplicate": False}
          '''.replace("          ", ""))
          PY

      - name: Install dependencies
        working-directory: madhushala-excise-bridge
        run: pip install -r requirements.txt

      - name: Compile application
        working-directory: madhushala-excise-bridge
        run: python -m compileall -q app tests

      - name: Run test suite
        working-directory: madhushala-excise-bridge
        run: pytest -q

      - name: Commit tested refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Koushik Biswas"
          git config user.email "k.kbiswas8@gmail.com"
          git add madhushala-excise-bridge
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Refactor purchase integration orchestration"
          git push origin HEAD:refactor/purchase-orchestration-v2
