name: Diagnose Madhushala Purchase API

on:
  push:
    branches:
      - fix/purchase-header-autofill
    paths:
      - ".github/workflows/diagnose-madhushala-purchase-api.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect purchase master endpoint schemas
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://reportapi.madhushalasoftware.com'
          curl -k -fsSL "$BASE/swagger/v1/swagger.json" -o /tmp/api.json
          python - <<'PY'
          import json
          api = json.load(open('/tmp/api.json'))
          wanted = [
              '/api/purchase/dropdown/suppliers',
              '/api/purchase/dropdown/storages',
              '/api/purchase/dropdown/purchase-accounts',
              '/api/counter-sales/users',
              '/api/excise-import/supplier',
              '/api/purchase/dropdown/company',
          ]
          for path in wanted:
              print('\n===', path, '===')
              print(json.dumps((api.get('paths') or {}).get(path), indent=2)[:12000])
          print('\n=== Referenced component schemas ===')
          text = json.dumps({p: (api.get('paths') or {}).get(p) for p in wanted})
          schemas = api.get('components', {}).get('schemas', {})
          for name, schema in schemas.items():
              if f'#/components/schemas/{name}' in text:
                  print('\n---', name, '---')
                  print(json.dumps(schema, indent=2)[:12000])
          PY
