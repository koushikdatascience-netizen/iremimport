name: Test Document Mapping Row Identity

on:
  push:
    branches:
      - fix/document-mapping-row-identity

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: madhushala-excise-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: madhushala-excise-bridge/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall -q app

      - name: Check mapping JavaScript
        run: node --check app/static/mapping-row-identity.js

      - name: Run tests
        run: pytest -q
