name: Apply UP QR Stability Fix

on:
  push:
    branches:
      - fix/up-qr-stability
    paths:
      - ".github/workflows/apply-up-qr-stability.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/up-qr-stability
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply focused QR stability fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('madhushala-excise-bridge/app/modules/document_import/up_excise_qr.py')
          text = path.read_text(encoding='utf-8')

          if 'import os\n' not in text:
              text = text.replace('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nimport os\n', 1)

          start = text.index('async def _render_up_transport_page(url: str) -> tuple[str, str]:\n')
          end = text.index('\n\nasync def extract_up_transport_pass(', start)
          replacement = '''async def _render_up_transport_page(url: str) -> tuple[str, str]:
              """Render UP Excise patiently; its public page often fills rows late via JavaScript."""
              from playwright.async_api import async_playwright

              async with async_playwright() as playwright:
                  browser = await playwright.chromium.launch(
                      # Production already runs under Xvfb. A headed browser is more reliable
                      # with this legacy public portal, while tests/local shells can stay headless.
                      headless=not bool(os.environ.get("DISPLAY")),
                      args=["--no-sandbox", "--disable-dev-shm-usage"],
                  )
                  context = await browser.new_context(
                      viewport={"width": 1366, "height": 768},
                      locale="en-US",
                      user_agent=(
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 (KHTML, like Gecko) "
                          "Chrome/128.0.0.0 Safari/537.36"
                      ),
                  )
                  try:
                      page = await context.new_page()
                      last_html = ""
                      last_url = url

                      # UP Excise intermittently returns only the empty table shell. Give the
                      # same public URL a few fresh browser loads before treating it as empty.
                      for attempt in range(3):
                          try:
                              if attempt == 0:
                                  await page.goto(
                                      url,
                                      wait_until="domcontentloaded",
                                      timeout=45000,
                                  )
                              else:
                                  await page.wait_for_timeout(1000 * attempt)
                                  await page.reload(
                                      wait_until="domcontentloaded",
                                      timeout=45000,
                                  )
                          except Exception:
                              if attempt == 2:
                                  raise
                              continue

                          last_url = page.url
                          try:
                              await page.wait_for_load_state("networkidle", timeout=8000)
                          except Exception:
                              # The portal keeps background connections open on some loads.
                              pass

                          # Do not rely on one brittle DOM selector. Parse successive DOM
                          # snapshots with the same product parser used by the import flow.
                          for _ in range(20):
                              last_html = await page.content()
                              if _product_rows(_payload_from_html(last_html)):
                                  return last_html, page.url
                              await page.wait_for_timeout(1000)

                      if not last_html:
                          last_html = await page.content()
                      return last_html, last_url
                  finally:
                      await context.close()
                      await browser.close()
          '''
          import textwrap
          replacement = textwrap.dedent(replacement)
          text = text[:start] + replacement.rstrip() + text[end:]

          old_detail = 'detail = "No populated product rows were found in the UP Excise transport-pass page"'
          new_detail = 'detail = "UP Excise did not populate product rows after automatic browser retries"'
          assert old_detail in text
          text = text.replace(old_detail, new_detail, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install and test
        working-directory: madhushala-excise-bridge
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall -q app
          pytest -q

      - name: Commit tested fix and remove helper workflow
        shell: bash
        run: |
          git config user.name 'Koushik Biswas'
          git config user.email 'k.kbiswas8@gmail.com'
          git rm .github/workflows/apply-up-qr-stability.yml
          git add madhushala-excise-bridge/app/modules/document_import/up_excise_qr.py
          git commit -m 'Harden UP Excise QR browser extraction'
          git push origin HEAD:fix/up-qr-stability
