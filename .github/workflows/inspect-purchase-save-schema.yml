name: Inspect Purchase Save Schema

on:
  push:
    branches:
      - fix/purchase-header-autofill
    paths:
      - ".github/workflows/inspect-purchase-save-schema.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect save schema
        shell: bash
        run: |
          set -euo pipefail
          curl -k -fsSL 'https://reportapi.madhushalasoftware.com/swagger/v1/swagger.json' -o /tmp/api.json
          python - <<'PY'
          import json
          api=json.load(open('/tmp/api.json'))
          path='/api/purchase/save'
          data=(api.get('paths') or {}).get(path) or {}
          print('=== PATH ===')
          print(json.dumps(data, indent=2)[:20000])
          refs=set()
          def walk(x):
              if isinstance(x, dict):
                  for k,v in x.items():
                      if k=='$ref' and isinstance(v,str): refs.add(v)
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(data)
          schemas=api.get('components',{}).get('schemas',{})
          seen=set()
          while refs:
              ref=refs.pop()
              name=ref.rsplit('/',1)[-1]
              if name in seen: continue
              seen.add(name)
              schema=schemas.get(name)
              print('\n=== SCHEMA', name, '===')
              print(json.dumps(schema, indent=2)[:20000])
              walk(schema)
          PY
